<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>jin</title>
<meta name="description" content="jin's page">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖤</text></svg>">
<style>
  :root {
    --bg: #000;
    --text: #fff;
    --muted: #8a8a8a;
    --border: rgba(255,255,255,.08);
    --offline: #80848e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }
  .wrap { width: 100%; max-width: 400px; text-align: center; position: relative; z-index: 3; }

  .fade { animation: rise .7s cubic-bezier(.2,.7,.3,1) forwards; }
  .d1 { animation-delay: .05s; } .d2 { animation-delay: .15s; } .d3 { animation-delay: .25s; } .d4 { animation-delay: .35s; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }

  /* waterfall background */
  #waterfall {
    position: fixed; inset: 0; z-index: 1;
    width: 100%; height: 100%;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  body.entered #waterfall { opacity: .4; }
  #vignette {
    position: fixed; inset: 0; z-index: 2;
    background: radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,.92) 100%);
    pointer-events: none;
  }

  /* music player */
  #player {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    z-index: 20;
    width: min(460px, calc(100vw - 32px));
    background: rgba(5,5,5,.72);
    border: 1px solid var(--border);
    border-radius: 14px;
    backdrop-filter: blur(8px);
    padding: 10px 14px 12px;
    transition: border-color .3s ease, box-shadow .3s ease;
  }
  #player.playing { border-color: rgba(140,180,255,.45); box-shadow: 0 0 24px rgba(140,180,255,.18); }
  #pl-bar { height: 4px; background: rgba(255,255,255,.08); border-radius: 2px; cursor: pointer; position: relative; }
  #pl-fill { height: 100%; width: 0; background: linear-gradient(90deg, #4da8ff, #7c5cff); border-radius: 2px; }
  #pl-time {
    display: flex; justify-content: space-between;
    font-size: 10px; color: var(--muted); margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  #pl-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  #pl-controls { display: flex; gap: 2px; flex: 0 0 auto; }
  #pl-controls button {
    background: none; border: none; color: var(--text); cursor: pointer;
    font-size: 13px; width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s ease;
  }
  #pl-controls button:hover { background: rgba(255,255,255,.08); }
  #pl-play { font-size: 15px !important; }
  #pl-info { flex: 1; min-width: 0; text-align: left; }
  #pl-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pl-artist { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pl-vol-wrap { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  #pl-vol-icon { font-size: 12px; }
  #pl-vol {
    -webkit-appearance: none; appearance: none;
    width: 64px; height: 3px; background: rgba(255,255,255,.15); border-radius: 2px;
    outline: none; cursor: pointer;
  }
  #pl-vol::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 11px; height: 11px; border-radius: 50%; background: #fff; cursor: pointer;
  }
  #pl-vol::-moz-range-thumb {
    width: 11px; height: 11px; border-radius: 50%; background: #fff; cursor: pointer; border: none;
  }

  #fx-main { position: fixed; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }
  .spark {
    position: absolute; width: 2px; height: 10px;
    border-radius: 1px;
    background: linear-gradient(180deg, #fff, rgba(150,200,255,0));
    transform: translate(-50%, -50%);
    transform-origin: top center;
    opacity: 0;
  }

  /* custom cursor */
  #cursor {
    position: fixed; left: 0; top: 0; z-index: 200;
    width: 32px; height: 32px; pointer-events: none;
    transform: translate(-999px, -999px);
  }
  #cursor canvas { width: 32px; height: 32px; }
  .drip {
    position: fixed; z-index: 201; pointer-events: none;
    width: 2px; height: 4px;
    background: rgba(150,200,255,.85);
    box-shadow: 0 0 3px rgba(150,200,255,.4);
    opacity: 1;
    transition: transform .55s cubic-bezier(.3,.6,.4,1), opacity .55s ease;
  }
  @media (pointer: fine) {
    * { cursor: none !important; }
  }

  /* intro overlay */
  #intro {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(0,0,0,.4);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    cursor: pointer;
    user-select: none;
    transition: backdrop-filter 1s ease, -webkit-backdrop-filter 1s ease, background 1s ease;
  }
  #intro.entering {
    backdrop-filter: blur(0);
    -webkit-backdrop-filter: blur(0);
    background: rgba(0,0,0,0);
  }
  #intro-canvas { position: absolute; inset: 0; transition: opacity .5s ease, transform .2s ease-out; }
  #glow {
    position: absolute; width: 560px; height: 560px; left: 0; top: 0;
    background: radial-gradient(circle, rgba(255,255,255,.07) 0%, transparent 60%);
    transform: translate(-50%,-50%);
    transition: transform .25s ease-out, opacity .5s ease;
    pointer-events: none;
  }
  #intro-inner {
    flex: 1; width: 100%;
    display: flex; flex-direction: column; align-items: center;
    position: relative; text-align: center; padding: 24px;
    transition: opacity .45s ease;
  }
  #intro-core { margin: auto; }
  #intro-inner.bye { opacity: 0; transform: scale(1.14); filter: blur(10px); transition: all .5s ease; }
  #intro-mark { margin: 0 auto 26px; display: block; filter: drop-shadow(0 0 14px rgba(255,255,255,.25)); animation: markFloat 4s ease-in-out infinite; }
  #intro-pfp {
    display: none;
    width: 112px; height: 112px; border-radius: 50%; object-fit: cover;
    margin: 0 auto 26px;
    box-shadow: 0 0 0 3px rgba(255,255,255,.08), 0 0 42px rgba(255,255,255,.16);
    animation: markFloat 4s ease-in-out infinite;
  }
  .mark-draw { animation: markDraw 1.6s cubic-bezier(.6,.05,.3,1) .2s forwards; }
  @keyframes markDraw { to { stroke-dashoffset: 0; } }
  @keyframes markFloat {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-7px) scale(1.04); }
  }
  #intro-name {
    font-size: clamp(20px, 4vw, 30px); font-weight: 700; letter-spacing: .38em;
    text-indent: .38em;
    color: #e8e8e8;
    background: linear-gradient(100deg, #666 20%, #fff 50%, #666 80%);
    background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 3.4s linear infinite;
  }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  #intro-hint {
    margin-top: 34px; color: #6a6a6a; font-size: 13px; letter-spacing: .18em;
    display: flex; align-items: center; justify-content: center; gap: 9px;
    animation: hintPulse 2.6s ease-in-out infinite;
  }
  .hint-dot { width: 6px; height: 6px; border-radius: 50%; background: #fff; }
  @keyframes hintPulse { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
  #intro-foot { margin: 0; padding: 0 0 26px; text-align: center; color: #3d3d3d; font-size: 11px; letter-spacing: .3em; text-indent: .3em; }

  /* profile */
  .avatar-wrap { position: relative; width: 112px; height: 112px; margin: 0 auto 18px; --status-color: var(--offline); }
  .avatar { width: 112px; height: 112px; border-radius: 50%; object-fit: cover; background: #181818; display: block; }
  .ring {
    position: absolute; inset: -7px; border-radius: 50%;
    border: 2px solid var(--status-color);
    animation: pulse 2.2s ease-out infinite;
    pointer-events: none;
  }
  @keyframes pulse {
    0% { transform: scale(.96); opacity: .7; }
    70% { transform: scale(1.25); opacity: 0; }
    100% { transform: scale(1.25); opacity: 0; }
  }
  #status-dot {
    position: absolute; right: 4px; bottom: 6px;
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--offline);
    border: 4px solid #000;
  }
  h1 { font-size: 24px; font-weight: 700; letter-spacing: -.01em; }
  #handle { color: var(--muted); margin-top: 3px; font-size: 14px; }
  #tagline { color: var(--muted); margin-top: 2px; font-size: 14px; min-height: 18px; }
  .cursor { display: inline-block; width: 2px; height: 1em; background: var(--muted); vertical-align: -2px; margin-left: 1px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #status-line { color: var(--muted); margin-top: 8px; font-size: 13px; }
  #activity {
    margin: 18px auto 0; max-width: 340px;
    background: #0a0a0a; border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 14px;
    font-size: 13px; color: var(--muted);
    display: none; text-align: left;
  }
  #activity.show { display: block; }
  .links { margin-top: 22px; }
  .links a {
    display: block; padding: 14px 18px;
    background: #0a0a0a; border: 1px solid var(--border);
    border-radius: 12px; color: var(--text);
    text-decoration: none; font-size: 15px; font-weight: 600;
    transition: border-color .15s ease, background .15s ease;
  }
  .links a:hover { border-color: rgba(255,255,255,.3); background: #111; }
  @media (prefers-reduced-motion: reduce) {
    #intro { display: none; }
    .fade { animation: none; opacity: 1; }
  }
</style>
<noscript><style>#intro{display:none}.fade{opacity:1}</style></noscript>
</head>
<body>
  <div id="intro">
    <canvas id="intro-canvas"></canvas>
    <div id="glow"></div>
    <div id="intro-inner">
      <div id="intro-core">
        <img id="intro-pfp" alt="">
        <svg id="intro-mark" viewBox="0 0 64 64" width="52" height="52">
          <defs>
            <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ffffff"/>
              <stop offset="1" stop-color="#8a8a8a"/>
            </linearGradient>
          </defs>
          <rect x="16" y="16" width="32" height="32" rx="3" transform="rotate(45 32 32)"
                fill="none" stroke="url(#mg)" stroke-width="1.5"
                stroke-dasharray="180" stroke-dashoffset="180" class="mark-draw"/>
        </svg>
        <div id="intro-name">JIN</div>
        <div id="intro-hint"><span class="hint-dot"></span>click anywhere to enter</div>
      </div>
      <div id="intro-foot">therealjewman.lol/jin</div>
    </div>
  </div>
  <canvas id="waterfall"></canvas>
  <div id="vignette"></div>
  <div id="fx-main"></div>
  <div id="cursor"><canvas id="cursor-canvas" width="32" height="32"></canvas></div>
  <audio id="bgm" src="lelo.mp3" preload="auto"></audio>
  <div id="player">
    <div id="pl-bar"><div id="pl-fill"></div></div>
    <div id="pl-time"><span id="pl-cur">0:00</span><span id="pl-tot">0:00</span></div>
    <div id="pl-row">
      <div id="pl-controls">
        <button id="pl-prev" title="previous">⏮</button>

      </div>

        <span id="pl-vol-icon">🔊</span>
        <input id="pl-vol" type="range" min="0" max="100" value="55" aria-label="volume">
      </div>

  <div class="wrap">
    <div class="avatar-wrap fade d1">
      <span class="ring"></span>
      <img id="avatar" class="avatar" alt="">
      <span id="status-dot"></span>
    </div>
    <h1 id="name" class="fade d2">jin</h1>
    <div id="handle" class="fade d2"></div>
    <p id="tagline" class="fade d3"></p>
    <p id="status-line" class="fade d3"></p>
    <div id="activity" class="fade d4"></div>
    <div class="links fade d4">
      <a href="https://discord.com/users/1509653070848721077" target="_blank" rel="noopener">add on discord →</a>
    </div>
  </div>

<script>
const ID = "1509653070848721077";
const STATUS_COLORS = { online: "#23a55a", idle: "#f0b232", dnd: "#f23f43", offline: "#80848e" };
const $ = (id) => document.getElementById(id);

function typewrite(text) {
  const el = $("tagline");
  if (!text || window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    el.textContent = text || "";
    return;
  }
  let i = 0;
  const cursor = document.createElement("span");
  cursor.className = "cursor";
  el.textContent = "";
  el.appendChild(cursor);
  const tick = () => {
    if (i < text.length) {
      cursor.insertAdjacentText("beforebegin", text[i++]);
      setTimeout(tick, 34 + Math.random() * 46);
    } else {
      cursor.remove();
    }
  };
  tick();
}

function fmtClock(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return (h ? h + ":" : "") + String(m).padStart(h ? 2 : 1, "0") + ":" + String(sec).padStart(2, "0");
}

function setAvatar(u) {
  if (!u || !u.avatar) return;
  const ext = u.avatar.startsWith("a_") ? "gif" : "png";
  const url = "https://cdn.discordapp.com/avatars/" + u.id + "/" + u.avatar + "." + ext;
  $("avatar").src = url + "?size=256";
  const ip = $("intro-pfp");
  ip.src = url + "?size=256";
  ip.style.display = "block";
  $("intro-mark").style.display = "none";
  const icon = document.querySelector('link[rel="icon"]');
  icon.href = url + "?size=64";
}

fetch("https://api.lanyard.rest/v1/users/" + ID)
  .then((r) => r.json())
  .then((j) => {
    if (!j.success || !j.data) return;
    const d = j.data, u = d.discord_user;
    $("name").textContent = u.global_name || u.username;
    $("handle").textContent = "@" + u.username;
    $("status-line").textContent = d.discord_status.charAt(0).toUpperCase() + d.discord_status.slice(1);
    const sc = STATUS_COLORS[d.discord_status] || STATUS_COLORS.offline;
    $("status-dot").style.background = sc;
    document.querySelector(".avatar-wrap").style.setProperty("--status-color", sc);
    setAvatar(u);
    const acts = Array.isArray(d.activities) ? d.activities.filter((a) => a.type !== 4) : [];
    if (acts.length) {
      const sp = acts.find((a) => a.type === 2 && a.details);
      const g = acts.find((a) => a.type === 0);
      const a = sp || g;
      if (a) {
        $("activity").textContent = sp
          ? "🎧 listening to " + a.details + (a.state ? " — " + a.state : "")
          : "🎮 playing " + a.name + (a.state ? " — " + a.state : "");
        $("activity").classList.add("show");
      }
    }
  })
  .catch(() => {});

/* ---- waterfall background ---- */
function setupWaterfall() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("waterfall");
  const cx = cv.getContext("2d");
  let P = [], W = 0, H = 0;
  const spawn = (top) => ({
    x: Math.random() * W,
    y: top ? -Math.random() * H : Math.random() * H,
    sp: 2.2 + Math.random() * 4.2,
    len: 10 + Math.random() * 26,
    sway: .4 + Math.random() * 1.4,
    ph: Math.random() * 6.28,
    a: .12 + Math.random() * .4,
    w: Math.random() < .15 ? 1.6 : .8
  });
  const build = () => {
    W = cv.width = window.innerWidth;
    H = cv.height = window.innerHeight;
    const n = Math.min(160, Math.floor(W / 9));
    P = Array.from({ length: n }, () => spawn());
  };
  const step = () => {
    cx.clearRect(0, 0, W, H);
    for (const p of P) {
      p.y += p.sp;
      p.ph += .05;
      const x = p.x + Math.sin(p.ph) * p.sway * 4;
      if (p.y - p.len > H) Object.assign(p, spawn(true));
      const g = cx.createLinearGradient(x, p.y - p.len, x, p.y);
      g.addColorStop(0, "rgba(140,190,255,0)");
      g.addColorStop(1, "rgba(150,200,255," + p.a.toFixed(3) + ")");
      cx.strokeStyle = g;
      cx.lineWidth = p.w;
      cx.beginPath();
      cx.moveTo(x, p.y - p.len);
      cx.lineTo(x, p.y);
      cx.stroke();
    }
    requestAnimationFrame(step);
  };
  window.addEventListener("resize", build);
  build();
  step();
}
setupWaterfall();

/* ---- music player ---- */
const TRACKS = [
  { title: "Limbless", artist: "Lelo", src: "lelo.mp3" },
  { title: "Freaks", artist: "Surf Curse", src: "freaks.mp3" }
];
let trackIdx = 0;
const bgmEl = $("bgm");

function loadTrack(i, autoplay) {
  trackIdx = (i + TRACKS.length) % TRACKS.length;
  const t = TRACKS[trackIdx];
  bgmEl.src = t.src;
  $("pl-title").textContent = t.title;
  $("pl-artist").textContent = t.artist;
  if (autoplay) bgmEl.play().catch(() => {});
}

$("pl-play").addEventListener("click", () => {
  if (bgmEl.paused) bgmEl.play().catch(() => {});
  else bgmEl.pause();
});
$("pl-next").addEventListener("click", () => loadTrack(trackIdx + 1, !bgmEl.paused));
$("pl-prev").addEventListener("click", () => {
  if (bgmEl.currentTime > 3) bgmEl.currentTime = 0;
  else loadTrack(trackIdx - 1, !bgmEl.paused);
});
$("pl-vol").addEventListener("input", (e) => { bgmEl.volume = e.target.value / 100; });
$("pl-bar").addEventListener("click", (e) => {
  const r = e.currentTarget.getBoundingClientRect();
  const p = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  if (bgmEl.duration) bgmEl.currentTime = p * bgmEl.duration;
});
bgmEl.addEventListener("play", () => {
  $("player").classList.add("playing");
  $("pl-play").textContent = "⏸";
});
bgmEl.addEventListener("pause", () => {
  $("player").classList.remove("playing");
  $("pl-play").textContent = "▶";
});
bgmEl.addEventListener("timeupdate", () => {
  const d = bgmEl.duration || 0, c = bgmEl.currentTime || 0;
  $("pl-fill").style.width = (d ? (c / d) * 100 : 0) + "%";
  $("pl-cur").textContent = fmtClock(c * 1000);
});
bgmEl.addEventListener("loadedmetadata", () => {
  $("pl-tot").textContent = fmtClock((bgmEl.duration || 0) * 1000);
});
bgmEl.addEventListener("ended", () => loadTrack(trackIdx + 1, true));

/* ---- click sparks ---- */
function spawnSpark(x, y) {
  const n = 7;
  for (let i = 0; i < n; i++) {
    const s = document.createElement("div");
    s.className = "spark";
    s.style.left = x + "px";
    s.style.top = y + "px";
    const ang = (i / n) * Math.PI * 2 + Math.random() * .5;
    const dist = 12 + Math.random() * 8;
    s.style.transition = "transform .55s cubic-bezier(.2,.7,.3,1), opacity .55s ease";
    $("fx-main").appendChild(s);
    requestAnimationFrame(() => {
      s.style.transform = "translate(-50%,-50%) rotate(" + (ang * 180 / Math.PI) + "deg) translateY(" + (-dist) + "px)";
      s.style.opacity = "1";
    });
    setTimeout(() => { s.style.opacity = "0"; }, 300);
    setTimeout(() => s.remove(), 750);
  }
}
document.addEventListener("click", (e) => {
  if (e.target.closest("a, button, input, #pl-bar")) return;
  spawnSpark(e.clientX, e.clientY);
});

/* ---- custom cursor + drips ---- */
function setupCursor() {
  if (!window.matchMedia("(pointer: fine)").matches) return;
  const cv = $("cursor-canvas");
  const c = cv.getContext("2d");
  c.beginPath();
  c.moveTo(5, 3);
  c.lineTo(5, 18);
  c.lineTo(10, 13);
  c.lineTo(13, 22);
  c.lineTo(16, 21);
  c.lineTo(13, 12);
  c.lineTo(18, 12);
  c.closePath();
  c.lineWidth = 2.5;
  c.lineJoin = "round";
  c.strokeStyle = "rgba(0,0,0,.9)";
  c.stroke();
  c.fillStyle = "#ffffff";
  c.fill();
  let mx = -100, my = -100, lastMove = 0;
  document.addEventListener("mousemove", (e) => {
    mx = e.clientX;
    my = e.clientY;
    lastMove = performance.now();
    $("cursor").style.transform = "translate(" + (mx - 1) + "px," + (my - 1) + "px)";
  });
  setInterval(() => {
    if (performance.now() - lastMove > 1200) return;
    const drops = 1 + (Math.random() < .6 ? 1 : 0);
    for (let i = 0; i < drops; i++) {
      const d = document.createElement("div");
      d.className = "drip";
      d.style.left = (mx + 9 + Math.random() * 6) + "px";
      d.style.top = (my + 20 + Math.random() * 4) + "px";
      const h = 4 + (Math.random() < .5 ? 1 : 0);
      d.style.height = h + "px";
      document.body.appendChild(d);
      const fall = 30 + Math.random() * 14;
      requestAnimationFrame(() => {
        d.style.transform = "translateY(" + fall + "px)";
        d.style.opacity = "0";
      });
      setTimeout(() => d.remove(), 700);
    }
  }, 140);
}
setupCursor();

/* ---- intro ---- */
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const intro = $("intro");

function playWhoosh() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const dur = 0.7;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const filt = ctx.createBiquadFilter();
    filt.type = "lowpass";
    filt.frequency.setValueAtTime(3200, ctx.currentTime);
    filt.frequency.exponentialRampToValueAtTime(180, ctx.currentTime + dur);
    osc.type = "sine";
    osc.frequency.setValueAtTime(160, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(64, ctx.currentTime + dur);
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.12);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    osc.connect(filt); filt.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + dur);
  } catch (e) {}
}

function setupStars() {
  const cv = $("intro-canvas");
  const cx = cv.getContext("2d");
  const glow = $("glow");
  let stars = [], W = 0, H = 0;
  const build = () => {
    W = cv.width = window.innerWidth;
    H = cv.height = window.innerHeight;
    const n = Math.min(140, Math.floor(W * H / 11000));
    stars = Array.from({ length: n }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() < .12 ? 1.4 + Math.random() * 1.2 : .3 + Math.random() * .9,
      tw: Math.random() * Math.PI * 2,
      sp: .12 + Math.random() * .5,
      drift: .01 + Math.random() * .05
    }));
  };
  const draw = () => {
    cx.clearRect(0, 0, W, H);
    for (const s of stars) {
      s.tw += .03;
      s.y -= s.sp;
      s.x += s.drift;
      if (s.y < -2) { s.y = H + 2; s.x = Math.random() * W; }
      if (s.x > W + 2) { s.x = -2; s.y = Math.random() * H; }
      const a = .25 + .55 * (0.5 + 0.5 * Math.sin(s.tw));
      cx.beginPath();
      cx.arc(s.x, s.y, s.r, 0, 6.2832);
      cx.fillStyle = "rgba(255,255,255," + a.toFixed(3) + ")";
      cx.fill();
    }
    requestAnimationFrame(draw);
  };
  window.addEventListener("resize", build);
  window.addEventListener("mousemove", (e) => {
    glow.style.transform = "translate(" + e.clientX + "px," + e.clientY + "px) translate(-50%,-50%)";
    cv.style.transform = "translate(" + ((e.clientX - W / 2) * -0.02) + "px," + ((e.clientY - H / 2) * -0.02) + "px) scale(1.06)";
  });
  build();
  draw();
}

function enterSite() {
  if (document.body.classList.contains("entering")) return;
  document.body.classList.add("entering");
  playWhoosh();
  const bgm = $("bgm");
  if (bgm && bgm.paused) {
    bgm.volume = 0;
    const pr = bgm.play();
    if (pr && pr.then) pr.then(() => {
      const fade = setInterval(() => {
        bgm.volume = Math.min(0.55, bgm.volume + 0.04);
        if (bgm.volume >= 0.55) clearInterval(fade);
      }, 250);
    }).catch(() => {});
  }
  intro.classList.add("entering");
  $("intro-canvas").style.opacity = "0";
  $("glow").style.opacity = "0";
  $("intro-inner").classList.add("bye");
  setTimeout(() => {
    document.body.classList.add("entered");
    typewrite("jin's page");
  }, 520);
  setTimeout(() => { intro.style.display = "none"; }, 1300);
}

if (reducedMotion) {
  document.body.classList.add("entered");
  typewrite("jin's page");
} else {
  setupStars();
  intro.addEventListener("click", () => enterSite());
  window.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") enterSite();
  });
}
</script>
</body>
