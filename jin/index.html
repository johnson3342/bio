<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>jin</title>
<meta name="description" content="jin's page">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖤</text></svg>">
<style>
  :root {
    --bg: #000;
    --text: #fff;
    --muted: #8a8a8a;
    --border: rgba(255,255,255,.08);
    --online: #23a55a; --idle: #f0b232; --dnd: #f23f43; --offline: #80848e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #000;
    color: var(--text);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 32px 16px;
  }
  .wrap { width: 100%; max-width: 380px; text-align: center; }
  .fade { animation: rise .7s cubic-bezier(.2,.7,.3,1) both; }
  .d2 { animation-delay: .12s; } .d3 { animation-delay: .22s; } .d4 { animation-delay: .32s; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
  .avatar-wrap { position: relative; width: 104px; height: 104px; margin: 0 auto 18px; }
  .avatar { width: 104px; height: 104px; border-radius: 50%; object-fit: cover; background: #181818; display: block; }
  #dot { position: absolute; right: 2px; bottom: 4px; width: 20px; height: 20px; border-radius: 50%; background: var(--offline); border: 4px solid #000; }
  h1 { font-size: 24px; font-weight: 700; }
  #handle { color: var(--muted); font-size: 14px; margin-top: 3px; }
  #status { color: var(--muted); font-size: 13px; margin-top: 10px; }
  #activity {
    margin: 20px auto 0; max-width: 320px;
    background: #0a0a0a; border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 14px;
    font-size: 13px; color: var(--muted);
    display: none; text-align: left;
  }
  #activity.show { display: block; }
  .links { margin-top: 24px; display: flex; flex-direction: column; gap: 10px; }
  .links a {
    display: block; padding: 13px 18px;
    background: #0a0a0a; border: 1px solid var(--border);
    border-radius: 12px; color: var(--text);
    text-decoration: none; font-size: 14px; font-weight: 600;
    transition: border-color .15s ease, background .15s ease;
  }
  .links a:hover { border-color: rgba(255,255,255,.3); background: #111; }
  .back { display: inline-block; margin-top: 20px; color: var(--muted); font-size: 12px; text-decoration: none; letter-spacing: .05em; }
  .back:hover { color: var(--text); }

  /* music player */
  #player {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    z-index: 20;
    width: min(400px, calc(100vw - 32px));
    background: rgba(5,5,5,.72);
    border: 1px solid var(--border);
    border-radius: 14px;
    backdrop-filter: blur(8px);
    padding: 10px 14px 12px;
    transition: border-color .3s ease, box-shadow .3s ease;
  }
  #player.playing { border-color: rgba(140,180,255,.45); box-shadow: 0 0 24px rgba(140,180,255,.18); }
  #pl-bar {
    height: 4px; background: rgba(255,255,255,.08); border-radius: 2px;
    cursor: pointer; position: relative;
  }
  #pl-fill {
    height: 100%; width: 0;
    background: linear-gradient(90deg, #4da8ff, #7c5cff);
    border-radius: 2px;
  }
  #pl-time {
    display: flex; justify-content: space-between;
    font-size: 10px; color: var(--muted); margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  #pl-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  #pl-play {
    background: none; border: none; color: var(--text); cursor: pointer;
    font-size: 15px; width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s ease;
    flex: 0 0 auto;
  }
  #pl-play:hover { background: rgba(255,255,255,.08); }
  #pl-info { flex: 1; min-width: 0; text-align: left; }
  #pl-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pl-artist { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pl-vol-wrap { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  #pl-vol-icon { font-size: 12px; }
  #pl-vol {
    -webkit-appearance: none; appearance: none;
    width: 64px; height: 3px; background: rgba(255,255,255,.15); border-radius: 2px;
    outline: none; cursor: pointer;
  }
  #pl-vol::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 11px; height: 11px; border-radius: 50%; background: #fff; cursor: pointer;
  }
  #pl-vol::-moz-range-thumb {
    width: 11px; height: 11px; border-radius: 50%; background: #fff; cursor: pointer; border: none;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="avatar-wrap fade">
      <img id="avatar" class="avatar" alt="">
      <span id="dot"></span>
    </div>
    <h1 id="name" class="fade d2">jin</h1>
    <div id="handle" class="fade d2"></div>
    <div id="status" class="fade d3"></div>
    <div id="activity" class="fade d4"></div>
    <div class="links fade d4">
      <a href="https://discord.com/users/1509653070848721077" target="_blank" rel="noopener">add on discord →</a>
    </div>
    <a class="back fade d4" href="/jewman/">← jewman</a>
  </div>

  <audio id="bgm" src="lelo.mp3" loop preload="metadata"></audio>
  <div id="player">
    <div id="pl-bar"><div id="pl-fill"></div></div>
    <div id="pl-time"><span id="pl-cur">0:00</span><span id="pl-tot">0:00</span></div>
    <div id="pl-row">
      <button id="pl-play" title="play / pause">▶</button>
      <div id="pl-info">
        <div id="pl-title">Limbless</div>
        <div id="pl-artist">Lelo</div>
      </div>
      <div id="pl-vol-wrap">
        <span id="pl-vol-icon">🔊</span>
        <input id="pl-vol" type="range" min="0" max="100" value="55" aria-label="volume">
      </div>
    </div>
  </div>

<script>
const ID = "1509653070848721077";
const COLORS = { online: "#23a55a", idle: "#f0b232", dnd: "#f23f43", offline: "#80848e" };
const $ = (id) => document.getElementById(id);

fetch("https://api.lanyard.rest/v1/users/" + ID)
  .then((r) => r.json())
  .then((j) => {
    if (!j.success || !j.data) return;
    const d = j.data, u = d.discord_user;
    $("name").textContent = u.global_name || u.username;
    $("handle").textContent = "@" + u.username;
    $("status").textContent = d.discord_status.charAt(0).toUpperCase() + d.discord_status.slice(1);
    $("dot").style.background = COLORS[d.discord_status] || COLORS.offline;
    if (u.avatar) {
      const ext = u.avatar.startsWith("a_") ? "gif" : "png";
      $("avatar").src = "https://cdn.discordapp.com/avatars/" + u.id + "/" + u.avatar + "." + ext + "?size=256";
      const icon = document.querySelector('link[rel="icon"]');
      icon.href = "https://cdn.discordapp.com/avatars/" + u.id + "/" + u.avatar + "." + ext + "?size=64";
    }
    const acts = Array.isArray(d.activities) ? d.activities.filter((a) => a.type !== 4) : [];
    if (acts.length) {
      const sp = acts.find((a) => a.type === 2 && a.details);
      const g = acts.find((a) => a.type === 0);
      const a = sp || g;
      if (a) {
        $("activity").textContent = sp
          ? "🎧 listening to " + a.details + (a.state ? " — " + a.state : "")
          : "🎮 playing " + a.name + (a.state ? " — " + a.state : "");
        $("activity").classList.add("show");
      }
    }
  })
  .catch(() => {});

/* ---- music player ---- */
function fmtClock(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const m = Math.floor(s / 60), sec = s % 60;
  return m + ":" + String(sec).padStart(2, "0");
}
const bgm = $("bgm");
$("pl-play").addEventListener("click", () => {
  if (bgm.paused) bgm.play().catch(() => {});
  else bgm.pause();
});
$("pl-vol").addEventListener("input", (e) => { bgm.volume = e.target.value / 100; });
$("pl-bar").addEventListener("click", (e) => {
  const r = e.currentTarget.getBoundingClientRect();
  const p = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  if (bgm.duration) bgm.currentTime = p * bgm.duration;
});
bgm.addEventListener("play", () => {
  $("player").classList.add("playing");
  $("pl-play").textContent = "⏸";
});
bgm.addEventListener("pause", () => {
  $("player").classList.remove("playing");
  $("pl-play").textContent = "▶";
});
bgm.addEventListener("timeupdate", () => {
  const d = bgm.duration || 0, c = bgm.currentTime || 0;
  $("pl-fill").style.width = (d ? (c / d) * 100 : 0) + "%";
  $("pl-cur").textContent = fmtClock(c * 1000);
});
bgm.addEventListener("loadedmetadata", () => {
  $("pl-tot").textContent = fmtClock((bgm.duration || 0) * 1000);
});
</script>
</body>
</html>
