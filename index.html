<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0e14">
<title>Your Name — Links</title>
<meta name="description" content="All my links in one place.">
<meta property="og:title" content="Your Name — Links">
<meta property="og:description" content="All my links in one place.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖤</text></svg>">
<style>
  :root {
    --bg: #0b0e14;
    --card: rgba(255,255,255,.04);
    --border: rgba(255,255,255,.09);
    --text: #e8ecf3;
    --muted: #8b93a5;
    --accent: #7c5cff;
    --accent2: #4da8ff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    background-image:
      radial-gradient(600px 300px at 20% 0%, rgba(124,92,255,.16), transparent 70%),
      radial-gradient(500px 300px at 80% 100%, rgba(77,168,255,.12), transparent 70%);
  }
  .wrap { width: 100%; max-width: 480px; text-align: center; }
  .avatar {
    width: 96px; height: 96px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; margin: 0 auto 20px;
    box-shadow: 0 0 0 4px rgba(255,255,255,.06), 0 12px 40px rgba(124,92,255,.25);
  }
  h1 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; }
  .tag { color: var(--muted); margin-top: 6px; font-size: 15px; }
  .links { display: flex; flex-direction: column; gap: 12px; margin-top: 32px; }
  .links a {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 20px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: var(--text);
    text-decoration: none;
    font-size: 16px; font-weight: 500;
    transition: transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .links a:hover {
    transform: translateY(-2px);
    border-color: rgba(124,92,255,.5);
    background: rgba(255,255,255,.07);
  }
  .links a .arrow { color: var(--muted); font-size: 18px; }
  .foot { margin-top: 36px; color: var(--muted); font-size: 13px; }
  .foot a { color: var(--muted); }
  @media (prefers-reduced-motion: reduce) {
    .links a { transition: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="avatar">🖤</div>
    <h1>Your Name</h1>
    <p class="tag">@yourhandle · doing things since whenever</p>

    <div class="links">
      <a href="https://github.com/yourusername" target="_blank" rel="noopener">
        GitHub <span class="arrow">→</span>
      </a>
      <a href="https://x.com/yourusername" target="_blank" rel="noopener">
        X / Twitter <span class="arrow">→</span>
      </a>
      <a href="https://youtube.com/@yourusername" target="_blank" rel="noopener">
        YouTube <span class="arrow">→</span>
      </a>
      <a href="https://discord.com/users/yourid" target="_blank" rel="noopener">
        Discord <span class="arrow">→</span>
      </a>
      <a href="https://therealjewman.lol" target="_blank" rel="noopener">
        My website <span class="arrow">→</span>
      </a>
    </div>

    <p class="foot">© 2025 Your Name · made with GitHub Pages</p>
  </div>
</body>
</html>
