<style>
  :root {
    --bg: #000;
    --text: #fff;
    --muted: #8a8a8a;
    --border: rgba(255,255,255,.08);
    --online: #23a55a;
    --idle: #f0b232;
    --dnd: #f23f43;
    --offline: #80848e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--bg); }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
  }
  .wrap { width: 100%; max-width: 420px; text-align: center; position: relative; z-index: 3; }

  /* waterfall background */
  #waterfall {
    position: fixed; inset: 0; z-index: 1;
    width: 100%; height: 100%;
    pointer-events: none;
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  body.entered #waterfall { opacity: .35; }
  #bg-gif {
    position: fixed; inset: 0; z-index: 0;
    background: url("bg.gif") center / cover no-repeat;
    filter: brightness(.5) saturate(.9);
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  body.entered #bg-gif { opacity: 1; }
  #vignette {
    position: fixed; inset: 0; z-index: 2;
    background: radial-gradient(ellipse at center, transparent 42%, rgba(0,0,0,.92) 100%);
    pointer-events: none;
  }
  /* music player */
  #player {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    z-index: 20;
    width: min(460px, calc(100vw - 32px));
    background: rgba(5,5,5,.72);
    border: 1px solid var(--border);
    border-radius: 14px;
    backdrop-filter: blur(8px);
    padding: 10px 14px 12px;
    transition: border-color .3s ease, box-shadow .3s ease;
  }
  #player.playing { border-color: rgba(140,180,255,.45); box-shadow: 0 0 24px rgba(140,180,255,.18); }
  #pl-bar {
    height: 4px; background: rgba(255,255,255,.08); border-radius: 2px;
    cursor: pointer; position: relative;
  }
  #pl-fill {
    height: 100%; width: 0;
    background: linear-gradient(90deg, #4da8ff, #7c5cff);
    border-radius: 2px;
  }
  #pl-time {
    display: flex; justify-content: space-between;
    font-size: 10px; color: var(--muted); margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  #pl-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  #pl-controls { display: flex; gap: 2px; flex: 0 0 auto; }
  #pl-controls button {
    background: none; border: none; color: var(--text); cursor: pointer;
    font-size: 13px; width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s ease;
  }
  #pl-controls button:hover { background: rgba(255,255,255,.08); }
  #pl-play { font-size: 15px !important; }
  #pl-info { flex: 1; min-width: 0; text-align: left; }
  #pl-title { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pl-artist { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pl-vol-wrap { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
  #pl-vol-icon { font-size: 12px; }
  #pl-vol {
    -webkit-appearance: none; appearance: none;
    width: 74px; height: 3px; background: rgba(255,255,255,.15); border-radius: 2px;
    outline: none; cursor: pointer;
  }
  #pl-vol::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 11px; height: 11px; border-radius: 50%; background: #fff; cursor: pointer;
  }
  #pl-vol::-moz-range-thumb {
    width: 11px; height: 11px; border-radius: 50%; background: #fff; cursor: pointer; border: none;
  }
  #fx-main { position: fixed; inset: 0; z-index: 5; pointer-events: none; overflow: hidden; }
  .spark {
    position: absolute; width: 2px; height: 10px;
    border-radius: 1px;
    background: linear-gradient(180deg, #fff, rgba(150,200,255,0));
    transform: translate(-50%, -50%);
    transform-origin: top center;
    opacity: 0;
  }
  #counter { position: fixed; top: 18px; right: 18px; z-index: 20; color: var(--muted); font-size: 12px; letter-spacing: .04em; }
  #confetti-canvas { position: fixed; inset: 0; z-index: 90; pointer-events: none; }

  /* custom cursor */
  * { cursor: url("regman.cur"), auto; }
  .drip {
    position: fixed; z-index: 201; pointer-events: none;
    width: 2px; height: 4px;
    background: rgba(150,200,255,.85);
    box-shadow: 0 0 3px rgba(150,200,255,.4);
    opacity: 1;
    transition: transform .55s cubic-bezier(.3,.6,.4,1), opacity .55s ease;
  }
  @media (pointer: fine) {
  }

  /* opening animation */
  .fade { animation: rise .7s cubic-bezier(.2,.7,.3,1) forwards; }
  .d1 { animation-delay: .05s; }
  .d2 { animation-delay: .15s; }
  .d3 { animation-delay: .25s; }
  .d4 { animation-delay: .35s; }
  .d5 { animation-delay: .45s; }
  .d6 { animation-delay: .55s; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }

  .avatar-wrap { position: relative; width: 112px; height: 112px; margin: 0 auto 18px; }

    display: flex; align-items: center; justify-content: center;

  #status-dot {
    position: absolute; right: 4px; bottom: 6px;
    width: 22px; height: 22px; border-radius: 50%;

  h1 { font-size: 24px; font-weight: 700; letter-spacing: -.01em; }

    position: absolute; inset: -7px; border-radius: 50%;
    border: 2px solid var(--status-color);

    pointer-events: none;

  @keyframes pulse {
    0% { transform: scale(.96); opacity: .7; }
    70% { transform: scale(1.25); opacity: 0; }
    100% { transform: scale(1.25); opacity: 0; }

  @keyframes markFloat {

  #intro-hint {

  /* activity card */
  #activity {

  #bros-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* bros modal */

  #bros-card {

  #bros-close {

  #bros-close:hover { color: var(--text); }
  #bm-avatar {
    width: 84px; height: 84px; border-radius: 50%; object-fit: cover;

  #bm-name { font-size: 19px; font-weight: 700; }
  #bm-username { font-size: 13px; color: var(--muted); margin-top: 2px; }
  #bm-status {

  #bm-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--offline); }
  #bm-activity {
    margin-top: 14px; font-size: 13px; color: var(--muted);

  #bm-add {

  }
  #bm-add:hover { opacity: .85; }
  @media (prefers-reduced-motion: reduce) {
    #intro { display: none; }
    .fade { animation: none; opacity: 1; }
  }
</style>

<script>
// ===== YOUR DISCORD SETTINGS =====
// 1. Discord → Settings → Advanced → enable Developer Mode
// 2. Right-click your name in Discord → "Copy User ID" → paste it below
const DISCORD_ID = "1256480459370795090";
// =================================

const STATUS_COLORS = { online: "#23a55a", idle: "#f0b232", dnd: "#f23f43", offline: "#80848e" };
const $ = (id) => document.getElementById(id);

let toastTimer;
function showToast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 1600);
}

function copyFallback(text, done) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.cssText = "position:fixed;opacity:0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); done(); } catch (e) {}
  ta.remove();
}

$("name").addEventListener("click", () => {
  const text = $("name").textContent;
  const done = () => showToast("copied \"" + text + "\"");
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(() => copyFallback(text, done));
  } else {
    copyFallback(text, done);
  }
});

function typewrite(text) {
  const el = $("tagline");
  if (!text || window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    el.textContent = text || "";
    return;
  }
  let i = 0;
  const cursor = document.createElement("span");
  cursor.className = "cursor";
  el.textContent = "";
  el.appendChild(cursor);
  const tick = () => {
    if (i < text.length) {
      cursor.insertAdjacentText("beforebegin", text[i++]);
      setTimeout(tick, 34 + Math.random() * 46);
    } else {
      cursor.remove();
    }
  };
  tick();
}

function setAvatar(user) {
  const el = $("avatar");
  if (user && user.avatar) {
    const ext = user.avatar.startsWith("a_") ? "gif" : "png";
    const img = document.createElement("img");
    img.className = "avatar";
    img.src = `https://cdn.discordapp.com/avatars/${user.id}/${user.avatar}.${ext}?size=256`;
    img.alt = "";
    img.onerror = () => {};
    el.replaceWith(img);
  }
}

function fmtClock(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  return (h ? h + ":" : "") + String(m).padStart(h ? 2 : 1, "0") + ":" + String(sec).padStart(2, "0");
}

function showActivity(acts) {
  const box = $("activity");
  if (!acts.length) { box.classList.remove("show"); return; }

  const spotify = acts.find(a => a.type === 2 && a.assets && a.assets.large_image);
  const game = acts.find(a => a.type === 0);
  const a = spotify || game;
  if (!a) { box.classList.remove("show"); return; }

  box.classList.add("show");
  $("act-label").textContent = spotify ? "listening to spotify" : "playing";
  $("act-title").textContent = spotify ? (a.details || "Spotify") : a.name;
  $("act-sub").textContent = a.state || "";

  const art = $("act-art");
  if (spotify && a.assets.large_image.startsWith("spotify:")) {
    art.src = "https://i.scdn.co/image/" + a.assets.large_image.split(":")[1];
    art.style.display = "";
  } else if (a.assets && a.assets.large_image && !a.assets.large_image.startsWith("mp:")) {
    art.src = `https://cdn.discordapp.com/app-assets/${a.application_id}/${a.assets.large_image}.png?size=128`;
    art.style.display = "";
  } else {
    art.style.display = "none";
  }

  const bar = $("act-bar"), fill = $("act-fill"), time = $("act-time");
  const upd = () => {
    if (a.timestamps && a.timestamps.start) {
      if (spotify && a.timestamps.end) {
        const total = a.timestamps.end - a.timestamps.start;
        const done = Date.now() - a.timestamps.start;
        bar.style.display = "";
        fill.style.width = Math.min(100, Math.max(0, (done / total) * 100)) + "%";
        time.textContent = fmtClock(done) + " / " + fmtClock(total);
      } else {
        bar.style.display = "none";
        time.textContent = fmtClock(Date.now() - a.timestamps.start) + " elapsed";
      }
    } else {
      bar.style.display = "none";
      time.textContent = "";
    }
  };
  upd();
  setInterval(upd, 1000);
}

/* ---- waterfall background ---- */
function setupWaterfall() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("waterfall");
  const cx = cv.getContext("2d");
  let P = [], W = 0, H = 0;
  const spawn = (top) => ({
    x: Math.random() * W,
    y: top ? -Math.random() * H : Math.random() * H,
    sp: 2.2 + Math.random() * 4.2,
    len: 10 + Math.random() * 26,
    sway: .4 + Math.random() * 1.4,
    ph: Math.random() * 6.28,
    a: .12 + Math.random() * .4,
    w: Math.random() < .15 ? 1.6 : .8
  });
  const build = () => {
    W = cv.width = window.innerWidth;
    H = cv.height = window.innerHeight;
    const n = Math.min(160, Math.floor(W / 9));
    P = Array.from({ length: n }, () => spawn());
  };
  const step = () => {
    cx.clearRect(0, 0, W, H);
    for (const p of P) {
      p.y += p.sp;
      p.ph += .05;
      const x = p.x + Math.sin(p.ph) * p.sway * 4;
      if (p.y - p.len > H) Object.assign(p, spawn(true));
      const g = cx.createLinearGradient(x, p.y - p.len, x, p.y);
      g.addColorStop(0, "rgba(140,190,255,0)");
      g.addColorStop(1, "rgba(150,200,255," + p.a.toFixed(3) + ")");
      cx.strokeStyle = g;
      cx.lineWidth = p.w;
      cx.beginPath();
      cx.moveTo(x, p.y - p.len);
      cx.lineTo(x, p.y);
      cx.stroke();
    }
    requestAnimationFrame(step);
  };
  window.addEventListener("resize", build);
  build();
  step();
}
setupWaterfall();

/* ---- pfp easter egg: 5 clicks ---- */
function burstConfetti() {
  const cv = $("confetti-canvas");
  const cx = cv.getContext("2d");
  cv.width = window.innerWidth;
  cv.height = window.innerHeight;
  const colors = ["#7c5cff", "#4da8ff", "#1db954", "#f23f43", "#f0b232", "#ffffff"];
  const P = [];
  const cx0 = cv.width / 2, cy0 = cv.height * 0.35;
  for (let i = 0; i < 140; i++) {
    const a = Math.random() * Math.PI * 2, sp = 4 + Math.random() * 9;
    P.push({
      x: cx0, y: cy0,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 4,
      g: .25 + Math.random() * .15,
      r: 3 + Math.random() * 5,
      c: colors[i % colors.length],
      rot: Math.random() * 6.28, vr: (Math.random() - .5) * .3,
      life: 1
    });
  }
  let start = performance.now();
  const step = (now) => {
    cx.clearRect(0, 0, cv.width, cv.height);
    const dt = Math.min(2, (now - start) / 16.7);
    start = now;
    let alive = false;
    for (const p of P) {
      if (p.life <= 0) continue;
      p.vy += p.g * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      p.life -= .006 * dt;
      if (p.life <= 0) continue;
      alive = true;
      cx.save();
      cx.translate(p.x, p.y);
      cx.rotate(p.rot);
      cx.fillStyle = p.c;
      cx.globalAlpha = Math.max(0, p.life);
      cx.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * .6);
      cx.restore();
    }
    if (alive) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ---- intro ---- */
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const intro = $("intro");

function playWhoosh() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const dur = 0.7;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    const filt = ctx.createBiquadFilter();
    filt.type = "lowpass";
    filt.frequency.setValueAtTime(3200, ctx.currentTime);
    filt.frequency.exponentialRampToValueAtTime(180, ctx.currentTime + dur);
    osc.type = "sine";
    osc.frequency.setValueAtTime(160, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(64, ctx.currentTime + dur);
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.12);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
    osc.connect(filt); filt.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + dur);
  } catch (e) {}
}

function setupStars() {
  const cv = $("intro-canvas");
  const cx = cv.getContext("2d");
  const glow = $("glow");
  let stars = [], W = 0, H = 0;
  const build = () => {
    W = cv.width = window.innerWidth;
    H = cv.height = window.innerHeight;
    const n = Math.min(140, Math.floor(W * H / 11000));
    stars = Array.from({ length: n }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() < .12 ? 1.4 + Math.random() * 1.2 : .3 + Math.random() * .9,
      tw: Math.random() * Math.PI * 2,
      sp: .12 + Math.random() * .5,
      drift: .01 + Math.random() * .05
    }));
  };
  const draw = () => {
    cx.clearRect(0, 0, W, H);
    for (const s of stars) {
      s.tw += .03;
      s.y -= s.sp;
      s.x += s.drift;
      if (s.y < -2) { s.y = H + 2; s.x = Math.random() * W; }
      if (s.x > W + 2) { s.x = -2; s.y = Math.random() * H; }
      const a = .25 + .55 * (0.5 + 0.5 * Math.sin(s.tw));
      cx.beginPath();
      cx.arc(s.x, s.y, s.r, 0, 6.2832);
      cx.fillStyle = "rgba(255,255,255," + a.toFixed(3) + ")";
      cx.fill();
    }
    requestAnimationFrame(draw);
  };
  window.addEventListener("resize", build);
  window.addEventListener("mousemove", (e) => {
    glow.style.transform = "translate(" + e.clientX + "px," + e.clientY + "px) translate(-50%,-50%)";
    cv.style.transform = "translate(" + ((e.clientX - W / 2) * -0.02) + "px," + ((e.clientY - H / 2) * -0.02) + "px) scale(1.06)";
  });
  build();
  draw();
}

function enterSite(x, y) {
  if (document.body.classList.contains("entering")) return;
  document.body.classList.add("entering");
  playWhoosh();
  const bgm = $("bgm");
  if (bgm && bgm.paused) {
    bgm.volume = 0;
    const pr = bgm.play();
    if (pr && pr.then) pr.then(() => {
      const fade = setInterval(() => {
        bgm.volume = Math.min(0.55, bgm.volume + 0.04);
        if (bgm.volume >= 0.55) clearInterval(fade);
      }, 250);
    }).catch(() => {});
  }
  intro.classList.add("entering");
  $("intro-canvas").style.opacity = "0";
  $("glow").style.opacity = "0";
  $("intro-inner").classList.add("bye");
  setTimeout(() => {
    document.body.classList.add("entered");
    typewrite("if you cant change the hoe change the hoe");
  }, 520);
  setTimeout(() => { intro.style.display = "none"; }, 1300);
}

if (reducedMotion) {
  document.body.classList.add("entered");
  typewrite("if you cant change the hoe change the hoe");
} else {
  setupStars();
  intro.addEventListener("click", (e) => enterSite(e.clientX, e.clientY));
  window.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") enterSite(window.innerWidth / 2, window.innerHeight / 2);
  });
}
